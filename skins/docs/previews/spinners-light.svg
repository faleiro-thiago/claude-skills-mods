<svg xmlns="http://www.w3.org/2000/svg" width="760" height="30" viewBox="0 0 760 30"><svg x="0" y="4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><style>.core,.wave{transform-box:view-box;transform-origin:12px 12px}.core{animation:breathe 1.6s ease-in-out infinite}.wave{animation:wave 1.6s ease-out infinite}@keyframes breathe{0%,100%{transform:scale(.75);opacity:.7}50%{transform:scale(1.05);opacity:1}}@keyframes wave{from{transform:scale(1);opacity:.55}to{transform:scale(2.7);opacity:0}}</style><circle class="wave" cx="12" cy="12" r="4" fill="none" stroke="#111111" stroke-width="1"/><circle class="core" cx="12" cy="12" r="4" fill="#111111"/></svg><text x="28" y="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" style="fill:#6b6b6b">Thinking</text><svg x="180" y="4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><style>.spin{transform-box:view-box;transform-origin:12px 12px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style><circle cx="12" cy="12" r="8" fill="none" stroke="#111111" stroke-opacity=".18" stroke-width="2"/><circle class="spin" cx="12" cy="12" r="8" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 40"/></svg><text x="208" y="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" style="fill:#6b6b6b">Running a tool</text><svg x="360" y="4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><style>.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq .9s ease-in-out infinite}.b2{animation-delay:.15s}.b3{animation-delay:.3s}@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}</style><rect class="bar b1" x="5" y="5" width="3" height="14" rx="1.5" fill="#111111"/><rect class="bar b2" x="10.5" y="5" width="3" height="14" rx="1.5" fill="#111111"/><rect class="bar b3" x="16" y="5" width="3" height="14" rx="1.5" fill="#111111"/></svg><text x="388" y="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" style="fill:#6b6b6b">Writing</text><svg x="540" y="4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><style>.dot{transform-box:fill-box;transform-origin:center;animation:hop 1.1s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}</style><circle class="dot d1" cx="6" cy="13" r="2.2" fill="#111111"/><circle class="dot d2" cx="12" cy="13" r="2.2" fill="#111111"/><circle class="dot d3" cx="18" cy="13" r="2.2" fill="#111111"/></svg><text x="568" y="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" style="fill:#6b6b6b">Waiting</text></svg>